site_name: pyweb2025-2.1 (Material)
site_url: https://icerzack.github.io/pyweb2025-2.1/v1/
site_description: "Вариант сайта с темой Material."
site_author: "Кузнецов Максим"
repo_url: https://github.com/icerzack/pyweb2025-2.1

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight

site_dir: site/v1

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Главная: index.md
  - Отчёт по деплою: deploy_report.md
  - Ответы: answers.md


